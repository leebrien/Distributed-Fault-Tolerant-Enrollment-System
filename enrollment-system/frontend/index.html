<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed University</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: none; }
        .service-badge { font-size: 0.8em; opacity: 0.7; }
        .hidden { display: none; }
        
        .nav-tabs .nav-link.active {
            color: #198754 !important;
            font-weight: bold;
            border-top: 3px solid #198754;
        }
        .nav-link { color: #495057; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-success mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Better animo.sys</a>
            <div id="user-display" class="text-white"></div>
            <button id="logout-btn" class="btn btn-sm btn-light hidden" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        
        <div id="login-section" class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4">
                    <h4 class="text-center mb-3">Student Login</h4>
                    <div class="mb-3">
                        <input type="text" id="username" class="form-control" placeholder="Username (e.g. student1)">
                    </div>
                    <div class="mb-3">
                        <input type="password" id="password" class="form-control" placeholder="Password">
                    </div>
                    <button class="btn btn-success w-100" onclick="login()">Sign In</button>
                    <div id="login-error" class="text-danger mt-2 text-center"></div>
                </div>
            </div>
        </div>

        <div id="dashboard-section" class="hidden">
            <ul class="nav nav-tabs mb-4">
                <li class="nav-item" id="nav-courses">
                    <a class="nav-link active" href="#" onclick="switchTab('courses')">Available Courses</a>
                </li>
                <li class="nav-item" id="nav-grades">
                    <a class="nav-link" href="#" onclick="switchTab('grades')">My Grades</a>
                </li>
                <li class="nav-item hidden" id="nav-faculty">
                    <a class="nav-link active" href="#" onclick="switchTab('faculty')">Faculty Upload</a>
                </li>
                <li class="nav-item hidden" id="nav-students">
                    <a class="nav-link" href="#" onclick="switchTab('students')">Student List</a>
                </li>
            </ul>

            <div id="tab-courses">
                <div id="course-list" class="row"></div>
                <div id="course-error" class="alert alert-danger hidden"></div>
            </div>

            <div id="tab-grades" class="hidden">
                <h3>Academic Record</h3>
                <div id="grades-list" class="mt-3"></div>
                <div id="grade-error" class="alert alert-danger hidden"></div>
            </div>

            <div id="tab-faculty" class="hidden">
                <div class="card p-4 bg-light">
                    <h4>Faculty Grade Upload</h4>
                    <div class="mb-2">
                        <input type="number" id="f-student-id" class="form-control" placeholder="Student ID (e.g. 1)">
                    </div>
                    <div class="mb-2">
                        <input type="number" id="f-course-id" class="form-control" placeholder="Course ID (e.g. 1)">
                    </div>
                    <div class="mb-2">
                        <input type="number" id="f-grade" class="form-control" placeholder="Grade (e.g. 4.0)">
                    </div>
                    <button class="btn btn-success" onclick="uploadGrade()">Upload Grade</button>
                </div>
            </div>

            <div id="tab-students" class="hidden">
                <h3>Registered Students</h3>
                <div id="student-list-container" class="mt-3"></div>
            </div>
        </div>

    </div>

    <script>
        let currentUser = null;
        let authToken = null;

        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await res.json();

                if (res.ok) {
                    authToken = data.token;
                    currentUser = data.user;
                    showDashboard();
                } else {
                    document.getElementById('login-error').innerText = data.message;
                }
            } catch (err) {
                document.getElementById('login-error').innerText = "Auth Service is Offline!";
            }
        }

        function showDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('user-display').innerText = `Welcome, ${currentUser.username} (${currentUser.role})`;
            
            if (currentUser.role === 'faculty') {
                // FACULTY VIEW
                document.getElementById('nav-faculty').classList.remove('hidden');
                document.getElementById('nav-students').classList.remove('hidden');
                document.getElementById('nav-courses').classList.add('hidden');
                document.getElementById('nav-grades').classList.add('hidden');
                
                switchTab('faculty'); 
            } else {
                // STUDENT VIEW
                document.getElementById('nav-faculty').classList.add('hidden');
                document.getElementById('nav-students').classList.add('hidden');
                document.getElementById('nav-courses').classList.remove('hidden');
                document.getElementById('nav-grades').classList.remove('hidden');
                
                switchTab('courses');
                loadCourses();
            }
        }

        function logout() {
            location.reload();
        }

        async function loadCourses() {
            try {
                const res = await fetch(`/api/courses?studentId=${currentUser.id}`);
                if (!res.ok) throw new Error("Service Down");
                
                const responseData = await res.json();
                const courses = responseData.data;
                const nodeName = responseData.node;

                const container = document.getElementById('course-list');
                container.innerHTML = `<div class="col-12 text-muted mb-2">Served by: ${nodeName}</div>`;

                courses.forEach(c => {
                    const html = `
                    <div class="col-md-4 mb-3">
                        <div class="card h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge bg-success">ID: ${c.id}</span>
                                    <small class="text-muted">Capacity: ${c.capacity}</small>
                                </div>
                                <h5 class="card-title">${c.title}</h5>
                                <p class="card-text">${c.description}</p>
                                <button class="btn btn-success w-100 mt-2" onclick="enroll(${c.id})">Enroll</button>
                            </div>
                        </div>
                    </div>`;
                    container.innerHTML += html;
                });
            } catch (err) {
                document.getElementById('course-error').classList.remove('hidden');
                document.getElementById('course-error').innerText = "Course Catalog Service is temporarily unavailable. Please try again later.";
            }
        }

        async function enroll(courseId) {
            try {
                const res = await fetch('/api/courses/enroll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentId: currentUser.id, courseId: courseId })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    alert(data.message || "Enrollment Successful!");
                    loadCourses(); 
                } else {
                    console.error("Server Error:", data);
                    alert("Failed: " + (data.message || "System is in Read-Only Mode"));
                }

            } catch (err) {
                console.error(err);
                alert("Network Error: Service is unreachable.");
            }
        }

        function switchTab(tab) {
            document.getElementById('tab-courses').classList.add('hidden');
            document.getElementById('tab-grades').classList.add('hidden');
            document.getElementById('tab-faculty').classList.add('hidden');
            document.getElementById('tab-students').classList.add('hidden');
            
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });

            document.getElementById('tab-' + tab).classList.remove('hidden');

            if(tab === 'courses') document.querySelector('#nav-courses a').classList.add('active');
            if(tab === 'grades') document.querySelector('#nav-grades a').classList.add('active');
            if(tab === 'faculty') document.querySelector('#nav-faculty a').classList.add('active');
            if(tab === 'students') document.querySelector('#nav-students a').classList.add('active');

            if (tab === 'grades') loadGrades();
            if (tab === 'courses') loadCourses();
            if (tab === 'students') loadStudents();
        }

        async function loadGrades() {
            try {
                const res = await fetch(`/api/grades?studentId=${currentUser.id}`);
                if (!res.ok) throw new Error("Service Down");

                const data = await res.json();
                const container = document.getElementById('grades-list');
                
                if (data.data.length === 0) {
                    container.innerHTML = "<p>No grades found.</p>";
                    return;
                }

                let html = `<table class="table table-hover"><thead><tr class="table-success"><th>Course</th><th>Grade</th></tr></thead><tbody>`;
                data.data.forEach(g => {
                    html += `<tr><td>${g.title}</td><td><strong>${g.grade}</strong></td></tr>`;
                });
                html += `</tbody></table><small class="text-muted">Served by: ${data.node}</small>`;
                container.innerHTML = html;

            } catch (err) {
                document.getElementById('grade-error').classList.remove('hidden');
                document.getElementById('grade-error').innerText = "Grade Service is temporarily unavailable.";
            }
        }

        async function uploadGrade() {
            const studentId = document.getElementById('f-student-id').value;
            const courseId = document.getElementById('f-course-id').value;
            const grade = document.getElementById('f-grade').value;

            try {
                const res = await fetch('/api/grades', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentId, courseId, grade })
                });
                const data = await res.json();
                alert(data.message);
            } catch (err) {
                alert("Upload failed. Grade Service might be down.");
            }
        }

        async function loadStudents() {
            try {
                const res = await fetch('/api/auth/students');
                const students = await res.json();
                
                const container = document.getElementById('student-list-container');
                let html = `
                <table class="table table-striped">
                    <thead class="table-success">
                        <tr>
                            <th>Student ID</th>
                            <th>Username</th>
                            <th>Enrolled Courses</th> </tr>
                    </thead>
                    <tbody>`;
                
                students.forEach(s => {
                    html += `
                        <tr>
                            <td><strong>${s.id}</strong></td>
                            <td>${s.username}</td>
                            <td>${s.enrolled_courses}</td>
                        </tr>`;
                });
                
                html += `</tbody></table>`;
                container.innerHTML = html;
            } catch (err) {
                alert("Failed to load student list.");
            }
        }
        
    </script>
</body>
</html>
