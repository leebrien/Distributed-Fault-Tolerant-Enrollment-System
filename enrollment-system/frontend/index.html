<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed University</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: none; }
        .service-badge { font-size: 0.8em; opacity: 0.7; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">DLSU Distributed Portal</a>
            <div id="user-display" class="text-white"></div>
            <button id="logout-btn" class="btn btn-sm btn-light hidden" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        
        <div id="login-section" class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4">
                    <h4 class="text-center mb-3">Student Login</h4>
                    <div class="mb-3">
                        <input type="text" id="username" class="form-control" placeholder="Username (e.g. student1)">
                    </div>
                    <div class="mb-3">
                        <input type="password" id="password" class="form-control" placeholder="Password">
                    </div>
                    <button class="btn btn-primary w-100" onclick="login()">Sign In</button>
                    <div id="login-error" class="text-danger mt-2 text-center"></div>
                </div>
            </div>
        </div>

        <div id="dashboard-section" class="hidden">
            <h2 class="mb-4">Available Courses</h2>
            <div id="course-list" class="row">
                </div>
            <div id="course-error" class="alert alert-danger hidden"></div>
        </div>

    </div>

    <script>
        let currentUser = null;
        let authToken = null;

        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await res.json();

                if (res.ok) {
                    authToken = data.token;
                    currentUser = data.user;
                    showDashboard();
                } else {
                    document.getElementById('login-error').innerText = data.message;
                }
            } catch (err) {
                document.getElementById('login-error').innerText = "Auth Service is Offline!";
            }
        }

        function showDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('user-display').innerText = `Welcome, ${currentUser.username}`;
            loadCourses();
        }

        function logout() {
            location.reload();
        }

        async function loadCourses() {
            try {
                const res = await fetch('/api/courses');
                if (!res.ok) throw new Error("Service Down");
                
                const responseData = await res.json();
                const courses = responseData.data;
                const nodeName = responseData.node;

                const container = document.getElementById('course-list');
                container.innerHTML = `<div class="col-12 text-muted mb-2">Served by: ${nodeName}</div>`;

                courses.forEach(c => {
                    const html = `
                    <div class="col-md-4 mb-3">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title">${c.title}</h5>
                                <p class="card-text">${c.description}</p>
                                <p class="text-muted">Capacity: ${c.capacity}</p>
                                <button class="btn btn-success w-100" onclick="enroll(${c.id})">Enroll</button>
                            </div>
                        </div>
                    </div>`;
                    container.innerHTML += html;
                });
            } catch (err) {
                document.getElementById('course-error').classList.remove('hidden');
                document.getElementById('course-error').innerText = "Course Catalog Service is temporarily unavailable. Please try again later.";
            }
        }

        async function enroll(courseId) {
            try {
                const res = await fetch('/api/courses/enroll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentId: currentUser.id, courseId: courseId })
                });
                const data = await res.json();
                alert(data.message);
            } catch (err) {
                alert("Enrollment failed (Service might be down)");
            }
        }
    </script>
</body>
</html>
