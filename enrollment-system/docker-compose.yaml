services:
  # Controller/Router
  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - course-service
      - frontend

  # View
  frontend:
    build: ./frontend

  # Microservices
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      - NODE_ENV=production
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=enrollment_db
      - DB_HOST_PRIMARY=db-primary
      - DB_HOST_REPLICA=db-replica
    depends_on:
      db-primary:
        condition: service_healthy
      db-replica:
        condition: service_healthy

  course-service:
    build:
      context: .
      dockerfile: course-service/Dockerfile
    environment:
      - NODE_ENV=production
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=enrollment_db
      - DB_HOST_PRIMARY=db-primary
      - DB_HOST_REPLICA=db-replica
    depends_on:
      db-primary:
        condition: service_healthy
      db-replica:
        condition: service_healthy
      
  grade-service:
    build:
      context: .
      dockerfile: grade-service/Dockerfile
    environment:
      - NODE_ENV=production
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=enrollment_db
      - DB_HOST_PRIMARY=db-primary
      - DB_HOST_REPLICA=db-replica
    depends_on:
      db-primary:
        condition: service_healthy
      db-replica:
        condition: service_healthy

  # Db Layers
  db-primary:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: enrollment_db
    volumes:
      - ./init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enrollment_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  db-replica:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: enrollment_db
    volumes:
      - ./init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enrollment_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
