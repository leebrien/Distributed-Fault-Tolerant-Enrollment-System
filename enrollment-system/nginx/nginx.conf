events {}

http {
    upstream auth_nodes {
        server auth-service:3000;
    }

    upstream course_nodes {
        server course-service:3001;
    }

    upstream grade_nodes {
        server grade-service:3002;
    }

    server {
        listen 80;

        # 1. Route for the "View" (Frontend)
        location / {
            proxy_pass http://frontend:80;
        }

        # 2. Route for Auth Service
        location /api/auth {
            proxy_pass http://auth_nodes;
            proxy_set_header Host $host;
        }

        # 3. Route for Course Service
        location /api/courses {
            proxy_pass http://course_nodes;
            proxy_set_header Host $host;
        }

        # 4: Route for Grade Service
        location /api/grades {
            proxy_pass http://grade_nodes;
            proxy_set_header Host $host;
        }
    }
}